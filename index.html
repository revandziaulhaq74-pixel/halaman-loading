<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman dengan Loading</title>
  
  <!-- 1. KODE CSS MASUK DI SINI -->
  <style>
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .spinner {
      border: 12px solid #f3f3f3;
      border-top: 12px solid #3498db;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 2. KODE HTML LOADING MASUK DI SINI (Di bagian paling atas body) -->
  <div id="preloader">
    <div class="spinner"></div>
  </div>

  <!-- Ini adalah contoh konten utama halaman Anda -->
  <main style="padding: 20px;">
    <h1>Selamat Datang di Website Saya</h1>
    <p>Ini adalah konten utama yang akan muncul setelah proses loading selesai.</p>
  </main>

  <!-- 3. KODE JAVASCRIPT MASUK DI SINI (Sebelum tag penutup body) -->
  <script>
    window.addEventListener("load", function() {
      const preloader = document.getElementById("preloader");
      preloader.style.opacity = "0";
      setTimeout(function() {
        preloader.style.display = "none";
      }, 500); // Menunggu 0.5 detik (sesuai durasi transisi CSS)
    });
  </script>
</body>
</html>
